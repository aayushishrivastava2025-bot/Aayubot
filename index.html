<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-60 bg-gray-950 flex flex-col justify-between border-r border-gray-800 transition-all duration-300 md:relative absolute inset-y-0 left-0 z-20 -translate-x-full md:translate-x-0 p-3">
        <button onclick="newChat()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-3 rounded-xl text-sm font-medium flex items-center gap-2 mb-3">
            <i class="fa-solid fa-plus"></i> New Chat
        </button>
        <div class="flex-1 overflow-y-auto space-y-1 text-xs text-gray-400">
            <div class="p-2 hover:bg-gray-800 rounded-lg cursor-pointer truncate text-gray-200">Current Chat</div>
        </div>
        <div class="border-t border-gray-800 pt-2 text-xs flex items-center justify-between text-gray-400">
            <span>AAYU</span>
            <i class="fa-solid fa-gear"></i>
        </div>
    </aside>

    <!-- Main Chat -->
    <main class="flex-1 flex flex-col h-full bg-gray-900">
        <!-- Header -->
        <header class="h-12 border-b border-gray-800 flex items-center px-4 gap-3">
            <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="md:hidden text-gray-400 hover:text-white">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-sm font-medium text-gray-200">AI Assistant</h1>
        </header>

        <!-- Messages -->
        <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm max-w-2xl mx-auto w-full">
            <div class="flex gap-3">
                <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs shrink-0">AI</div>
                <div class="bg-gray-800 p-3 rounded-xl text-gray-200">Hello! Main aapki kya madad karoon?</div>
            </div>
        </div>

        <!-- Input Box -->
        <div class="p-3 bg-gray-900 border-t border-gray-800">
            <form onsubmit="sendMsg(event)" class="max-w-2xl mx-auto flex items-center bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 focus-within:border-indigo-500">
                <input id="input" type="text" placeholder="Type a message..." autocomplete="off" class="flex-1 bg-transparent py-1.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white w-8 h-8 rounded-lg flex items-center justify-center text-xs">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function sendMsg(e) {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // User bubble
            chat.insertAdjacentHTML('beforeend', `<div class="flex gap-3 justify-end"><div class="bg-indigo-600 p-3 rounded-xl text-white max-w-md">${text}</div></div>`);
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // AI mock response
            setTimeout(() => {
                chat.insertAdjacentHTML('beforeend', `<div class="flex gap-3"><div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs shrink-0">AI</div><div class="bg-gray-800 p-3 rounded-xl text-gray-200">Echo: ${text}</div></div>`);
                chat.scrollTop = chat.scrollHeight;
            }, 500);
        }

        function newChat() {
            chat.innerHTML = `<div class="flex gap-3"><div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs shrink-0">AI</div><div class="bg-gray-800 p-3 rounded-xl text-gray-200">New chat started!</div></div>`;
        }
    </script>
</body>
</html>
